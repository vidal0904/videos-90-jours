  <script>
    const tl = gsap.timeline({ paused: true });
    const temps = document.getElementById("chr-temps");
    const reste = { s: 5400 };
    const affiche = () => {
      const s = Math.max(0, Math.round(reste.s));
      temps.textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
    };
    // Image 0 : « 90:00 » et l'accroche sont là. Le chrono démarre (quelques secondes qui défilent)
    tl.fromTo(reste, { s: 5400 }, { s: 5394, duration: 4, ease: "none", onUpdate: affiche }, 1.0);
    tl.to("#chr-texte", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 4.8);
    // « Un » (5,3 s) : le chrono monte en haut, réduit
    tl.to("#chr-bloc", { y: -440, scale: 0.55, duration: 0.5, ease: "power3.inOut" }, 4.9);
    // Chaque carte arrive sur son numéro ; le chrono descend jusqu'à la valeur de fin d'étape
    const fins = [75, 60, 40, 25, 10, 0];
    const cartes = [...document.querySelectorAll(".chr-carte")];
    cartes.forEach((c, i) => {
      const t = parseFloat(c.dataset.t);
      const suivant = i < cartes.length - 1 ? parseFloat(cartes[i + 1].dataset.t) : 27.3;
      tl.fromTo(c, { opacity: 0, x: 120 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, t - 0.15);
      tl.fromTo(c.querySelector(".chr-icone"), { scale: 0.6, rotation: -8 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, t - 0.05);
      if (i < cartes.length - 1) tl.to(c, { opacity: 0, x: -120, duration: 0.3, ease: "power2.in" }, suivant - 0.35);
      tl.to(reste, { s: fins[i] * 60, duration: Math.max(0.5, suivant - t - 0.4), ease: "power1.inOut", onUpdate: affiche }, t);
    });
    window.__timelines["v7-chrono"] = tl;
  </script>
